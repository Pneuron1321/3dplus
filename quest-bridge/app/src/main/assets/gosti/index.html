<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="referrer" content="no-referrer">
<meta name="theme-color" content="#0d0e14">
<title>Эфир Плюса</title>
<link rel="icon" href="data:,">
<link rel="stylesheet" href="gost.css">
</head>
<body>
<header>
  <div class="logo"><span id="tochka" class="tochka"></span><b>PLUS</b> <span id="zagolovok">эфир</span></div>
  <div id="set" class="set" hidden></div>
</header>

<main>
  <!-- вход -->
  <section id="ekranVhod" class="ekran">
    <h1 id="tVhodZag">Вход в эфир</h1>
    <p id="tVhodPod" class="pod">Тебя зовут в стрим Александра. Нужны камера и микрофон.</p>
    <div class="ya">
      <div class="kvadrat"><video id="ya" autoplay muted playsinline></video><div id="yaNet" class="bezvideo">🙂</div></div>
      <div class="uroven"><i id="uroven"></i></div>
    </div>
    <label class="pole"><span id="tImya">Имя в эфире</span><input id="imya" maxlength="18" autocomplete="nickname" spellcheck="false"></label>
    <div class="ryad">
      <button id="knKamera" class="tumbler vkl" type="button">📷 <span id="tKamera">Камера</span></button>
      <button id="knMikrofon" class="tumbler vkl" type="button">🎤 <span id="tMikrofon">Микрофон</span></button>
      <button id="knPovernut" class="tumbler" type="button" hidden>🔄</button>
    </div>
    <p id="tNaushniki" class="sovet">🎧 Надень наушники — иначе эфир услышит эхо.</p>
    <button id="knRazreshit" class="glavnaya" type="button">Включить камеру и микрофон</button>
    <button id="knVoyti" class="glavnaya" type="button" hidden>Войти</button>
    <p id="vhodOshibka" class="oshibka" hidden></p>
  </section>

  <!-- ожидание впуска -->
  <section id="ekranZhdi" class="ekran" hidden>
    <h1 id="tZhdiZag">Ждём, пока впустят…</h1>
    <p id="tZhdiPod" class="pod">Модератор или Александр сейчас тебя впустят. Не закрывай страницу.</p>
    <div class="krutilka"></div>
  </section>

  <!-- в эфире -->
  <section id="ekranEfir" class="ekran" hidden>
    <div id="prevyuBlok" class="prevyu"><canvas id="prevyu" width="640" height="360"></canvas><div id="prevyuNet" class="prevyuNet"></div></div>
    <div id="zametka" class="zametka" hidden></div>
    <div id="paneli" class="paneli">
      <div class="ya malenkiy">
        <div class="kvadrat"><video id="ya2" autoplay muted playsinline></video><div id="ya2Net" class="bezvideo">🙂</div></div>
        <div class="uroven"><i id="uroven2"></i></div>
      </div>
      <div class="upr">
        <div class="ryad">
          <button id="knMik2" class="krug vkl" type="button" title="Микрофон">🎤</button>
          <button id="knKam2" class="krug vkl" type="button" title="Камера">📷</button>
          <button id="knPov2" class="krug" type="button" hidden>🔄</button>
          <button id="knVyyti" class="krug krasnyy" type="button" title="Выйти">✕</button>
        </div>
        <label class="polzunok"><span id="tSlyshno">🔊 Слышно</span><input id="gromkost" type="range" min="0" max="150" value="100"></label>
        <label class="polzunok"><span id="tIgra">🎮 Игра</span><input id="igra" type="range" min="0" max="100" value="50"></label>
      </div>
    </div>
    <h2 id="tLyudi">В эфире</h2>
    <ul id="lyudi" class="lyudi"></ul>
  </section>

  <!-- пульт: модератор и хозяин -->
  <section id="pult" class="pult" hidden>
    <h2 id="tPult">Пульт</h2>
    <div id="zhdut" class="zhdut"></div>
    <div id="pultLyudi"></div>
    <div class="ryad obertka">
      <button id="knPriglasit" type="button">📨 <span id="tPriglasit">Пригласить гостя</span></button>
      <button id="knModer" type="button" hidden>🛡 <span id="tModerSsylka">Ссылка модератора</span></button>
      <button id="knNovaya" type="button">♻ <span id="tNovaya">Новая ссылка гостя</span></button>
    </div>
    <div id="hozyain" class="ryad obertka" hidden>
      <button id="knVpusk" type="button"></button>
      <button id="knMest" type="button"></button>
    </div>
    <p id="pultOtvet" class="pod"></p>
  </section>

  <!-- конец -->
  <section id="ekranKonec" class="ekran" hidden>
    <h1 id="konecZag">Ты вышел из эфира</h1>
    <p id="konecPod" class="pod"></p>
    <button id="knSnova" class="glavnaya" type="button">Войти снова</button>
  </section>
</main>

<audio id="petlya" autoplay playsinline></audio>
<script src="gost.js"></script>
</body>
</html>
