<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>PIXEL MECH · модульный коллекционный</title>
<style>
  :root{
    --sky1:#b6dcf7; --sky2:#86bfe9; --ink:#0f1a2b; --dim:#3a5068; --chip:rgba(255,255,255,.78);
    --chip-on:#0f1a2b; --chip-on-ink:#ffffff; --accent:#e0231e; --line:rgba(15,26,43,.14);
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){ --sky1:#1d2d48; --sky2:#0c1524; --ink:#eef3fb; --dim:#9fb2cc;
      --chip:rgba(20,30,48,.82); --chip-on:#eef3fb; --chip-on-ink:#0c1524; --line:rgba(238,243,251,.14); }
  }
  :root[data-theme="dark"]{ --sky1:#1d2d48; --sky2:#0c1524; --ink:#eef3fb; --dim:#9fb2cc;
    --chip:rgba(20,30,48,.82); --chip-on:#eef3fb; --chip-on-ink:#0c1524; --line:rgba(238,243,251,.14); }
  html,body{ height:100%; margin:0 }
  body{ background:radial-gradient(120% 90% at 50% 38%, var(--sky1), var(--sky2)); color:var(--ink);
        font:15px/1.4 "Segoe UI", system-ui, -apple-system, sans-serif; overflow:hidden }
  canvas#scena{ position:fixed; inset:0; width:100%; height:100%; display:block; touch-action:none; cursor:grab }
  canvas#scena:active{ cursor:grabbing }
  header{ position:fixed; left:0; right:0; top:0; padding:calc(env(safe-area-inset-top,0px) + 14px) 18px 0;
          pointer-events:none; display:flex; justify-content:space-between; align-items:flex-start; gap:12px }
  .znak{ font-weight:900; font-size:clamp(24px,5.4vw,42px); letter-spacing:.01em; line-height:.95; margin:0 }
  .znak sup{ font-size:.32em; font-weight:700; vertical-align:top; margin-left:2px }
  .znak small{ display:block; font-size:clamp(10px,2.3vw,13px); font-weight:600; letter-spacing:clamp(.14em,1vw,.34em);
               color:var(--dim); margin-top:8px }
  .podskazka{ font-size:12px; color:var(--dim); text-align:right; max-width:240px }
  #schet{ font-variant-numeric:tabular-nums }
  nav{ position:fixed; left:0; right:0; bottom:0; padding:0 10px calc(env(safe-area-inset-bottom,0px) + 12px);
       display:flex; flex-direction:column; gap:8px }
  .ryad{ display:flex; gap:8px; overflow-x:auto; width:fit-content; max-width:100%; margin:0 auto;
         padding:2px 4px; scrollbar-width:none }
  .ryad::-webkit-scrollbar{ display:none }
  button{ font:inherit; font-weight:700; font-size:14px; white-space:nowrap; border:1px solid var(--line);
          background:var(--chip); color:var(--ink); border-radius:999px; padding:10px 16px; min-height:44px;
          cursor:pointer; backdrop-filter:blur(8px); -webkit-backdrop-filter:blur(8px) }
  button[aria-pressed="true"]{ background:var(--chip-on); color:var(--chip-on-ink); border-color:transparent }
  button.glavnaya{ background:var(--accent); color:#fff; border-color:transparent }
  button:focus-visible{ outline:3px solid var(--accent); outline-offset:2px }
  button:disabled{ opacity:.55 }
  #linii{ position:fixed; inset:0; width:100%; height:100%; pointer-events:none; overflow:visible }
  #linii line{ stroke:var(--dim); stroke-width:1; stroke-dasharray:2 3; opacity:.8 }
  #linii circle{ fill:var(--ink) }
  .metka{ position:fixed; left:0; top:0; pointer-events:none; opacity:0; transition:opacity .25s ease; white-space:nowrap;
          font-size:11px; font-weight:800; letter-spacing:.14em; text-transform:uppercase; color:var(--ink);
          background:var(--chip); border:1px solid var(--line); padding:4px 8px; border-radius:6px }
  .magnit{ position:fixed; left:0; top:0; width:16px; height:16px; margin:-8px 0 0 -8px; border-radius:50%;
           border:1.5px solid var(--ink); opacity:0; transition:opacity .25s ease; pointer-events:none }
  .magnit::after{ content:""; position:absolute; inset:3.5px; border-radius:50%; border:1.5px solid var(--ink) }
  #toast{ position:fixed; left:50%; top:calc(env(safe-area-inset-top,0px) + 90px); transform:translateX(-50%);
          background:var(--chip); border:1px solid var(--line); border-radius:12px; padding:10px 14px;
          font-size:14px; font-weight:600; display:none; max-width:calc(100% - 32px); text-align:center }
  @media (max-width: 520px){
    .metka{ font-size:9px; letter-spacing:.08em; padding:3px 5px }
    .znak small{ letter-spacing:.12em }
    .podskazka .dlinno{ display:none }
  }
  @media (prefers-reduced-motion: reduce){ .metka, .magnit{ transition:none } }
</style>
</head>
<body>
<canvas id="scena" aria-label="Трёхмерная модель Pixel Mech из кирпичиков: тяни, чтобы вращать"></canvas>
<header>
  <h1 class="znak">PIXEL MECH<sup>™</sup><small>МОДУЛЬНЫЙ КОЛЛЕКЦИОННЫЙ</small></h1>
  <div class="podskazka"><span class="dlinno">тяни — вращать · щипок или колесо — ближе · двойной тап — сброс<br></span><span id="schet"></span></div>
</header>
<svg id="linii" aria-hidden="true"></svg>
<div id="metki"></div>
<div id="toast" role="status"></div>
<nav>
  <div class="ryad" role="group" aria-label="Состояние">
    <button data-sost="тихо" aria-pressed="true">Тихо</button>
    <button data-sost="говорит" aria-pressed="false">Говорит</button>
    <button data-sost="думает" aria-pressed="false">Думает</button>
    <button data-sost="слушает" aria-pressed="false">Слушает</button>
    <button data-sost="улыбка" aria-pressed="false">Улыбка</button>
  </div>
  <div class="ryad" role="group" aria-label="Вид и файлы">
    <button id="bRazobrat" aria-pressed="false">Разобрать</button>
    <button id="bOchki" aria-pressed="true">Очки</button>
    <button id="bVid">Вид ↻</button>
    <button id="bKrutit" aria-pressed="true">Автоповорот</button>
    <button id="bSnimok">Снимок PNG</button>
    <button id="bSkachat" class="glavnaya">Скачать GLB</button>
  </div>
</nav>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/exporters/GLTFExporter.js"></script>
<script src="src/pixel-mech.js"></script>
<script>
'use strict';
/* Вьювер PIXEL MECH: вращение, состояния лица, разобранный вид с подписями
   и «магнитами» на стыках, снимок PNG и экспорт GLB. Модель — src/pixel-mech.js. */
const T = THREE;
const cv = document.getElementById('scena');
const r = new T.WebGLRenderer({ canvas: cv, antialias: true, alpha: true, preserveDrawingBuffer: true });
r.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
const scene = new T.Scene();
const studio = PixelMech.stage(T, r, scene, { shadowMap: 2048, shadow: 0.18 });
const model = PixelMech.create(T);
scene.add(model.root);
const anim = PixelMech.makeAnimator(T, model);
const cam = new T.PerspectiveCamera(26, 1, 1, 600);
const P = model.parts;
document.getElementById('schet').textContent = model.stats.bricks + ' кирпичей · ' + model.stats.studs + ' шипов';

/* ---------- подписи разобранного вида: колонка справа и выноски, как на листе ---------- */
const PODPISI = {
  shapka: ['Шапка-череп', [5.6, 8.3, 0]],
  ochki: ['Очки', [5.95, 6.4, 1.2]],
  lico: ['Лицевая панель', [4.8, 3.4, 4.8]],
  bokR: ['Боковые плиты', [6.4, 1.6, -1.6]],
  sheya: ['Шея-штырь', [1.45, 0.7, 0.1]],
  korpus: ['Корпус', [4.8, 13.0, 3.2]],
  rukaR: ['Кулаки', [2.6, 1.0, 0.6]],
  nogaR: ['Ноги с шарнирами', [1.6, -2.0, 1.6]],
  stupnyaR: ['Ступни', [9.2, 2.2, 3.0]]
};
/* магниты-защёлки: точки на стыках (в координатах детали) */
const MAGNITY = [
  ['lico', [-4.8, 7.5, 4.0]], ['lico', [4.8, 7.5, 4.0]], ['sheya', [-1.6, -0.9, 0]], ['sheya', [1.6, -0.9, 0]],
  ['korpus', [-5.8, 14.2, 2.2]], ['korpus', [5.8, 14.2, 2.2]], ['korpus', [-5.8, 11.4, 2.2]], ['korpus', [5.8, 11.4, 2.2]],
  ['nogaL', [-2.4, -0.4, 1.8]], ['nogaR', [2.4, -0.4, 1.8]], ['stupnyaL', [-9.8, 5.2, 1.8]], ['stupnyaR', [9.8, 5.2, 1.8]]
];
const metki = {}, magnity = [], linii = {}, SVGNS = 'http://www.w3.org/2000/svg';
const svg = document.getElementById('linii');
Object.keys(PODPISI).forEach(k => {
  const el = document.createElement('div'); el.className = 'metka'; el.textContent = PODPISI[k][0];
  document.getElementById('metki').appendChild(el); metki[k] = el;
  const ln = document.createElementNS(SVGNS, 'line'), dot = document.createElementNS(SVGNS, 'circle');
  dot.setAttribute('r', '2.2'); svg.appendChild(ln); svg.appendChild(dot); linii[k] = [ln, dot];
});
MAGNITY.forEach(() => { const el = document.createElement('div'); el.className = 'magnit'; document.getElementById('metki').appendChild(el); magnity.push(el); });

/* ---------- камера: вращение, щипок, колесо ---------- */
let krutit = true, yaw = 0.5, pitch = 0.14, dist = 1, dYaw = 0, tihoDo = 0, dtK = 1, tPred = 0;
const VIDY = [[0, 0.06], [0.5, 0.14], [Math.PI / 2, 0.08], [Math.PI, 0.12], [-0.6, 0.85]];
let vidI = 1;
const ptr = new Map();
let pinch0 = 0, dist0 = 1, posledTap = 0;
cv.addEventListener('pointerdown', e => {
  cv.setPointerCapture(e.pointerId); ptr.set(e.pointerId, { x: e.clientX, y: e.clientY });
  tihoDo = performance.now() + 4000;
  if (ptr.size === 2){ const [a, b] = [...ptr.values()]; pinch0 = Math.hypot(a.x - b.x, a.y - b.y); dist0 = dist; }
  const t = performance.now();
  if (t - posledTap < 300){ yaw = VIDY[1][0]; pitch = VIDY[1][1]; dist = 1; dYaw = 0; }
  posledTap = t;
});
cv.addEventListener('pointermove', e => {
  if (!ptr.has(e.pointerId)) return;
  const pr = ptr.get(e.pointerId);
  if (ptr.size === 1){
    const dx = e.clientX - pr.x, dy = e.clientY - pr.y;
    yaw -= dx * 0.008; pitch = Math.max(-0.35, Math.min(1.3, pitch + dy * 0.006)); dYaw = -dx * 0.008;
  }
  ptr.set(e.pointerId, { x: e.clientX, y: e.clientY });
  if (ptr.size === 2){
    const [a, b] = [...ptr.values()], d = Math.hypot(a.x - b.x, a.y - b.y);
    if (pinch0) dist = Math.max(0.3, Math.min(1.8, dist0 * pinch0 / d));
  }
  tihoDo = performance.now() + 4000;
});
const otpusk = e => { ptr.delete(e.pointerId); if (ptr.size < 2) pinch0 = 0; };
cv.addEventListener('pointerup', otpusk);
cv.addEventListener('pointercancel', otpusk);
cv.addEventListener('wheel', e => { e.preventDefault(); dist = Math.max(0.3, Math.min(1.8, dist * (1 + e.deltaY * 0.001))); tihoDo = performance.now() + 4000; }, { passive: false });

/* ---------- кнопки ---------- */
const toast = (t, ms) => { const el = document.getElementById('toast'); el.textContent = t; el.style.display = 'block';
  clearTimeout(toast.t); toast.t = setTimeout(() => { el.style.display = 'none'; }, ms || 3500); };
document.querySelectorAll('[data-sost]').forEach(b => b.addEventListener('click', () => {
  anim.st.state = b.dataset.sost;
  document.querySelectorAll('[data-sost]').forEach(x => x.setAttribute('aria-pressed', x === b ? 'true' : 'false'));
}));
const bR = document.getElementById('bRazobrat');
bR.addEventListener('click', () => {
  anim.st.explodeTarget = anim.st.explodeTarget ? 0 : 1;
  bR.setAttribute('aria-pressed', anim.st.explodeTarget ? 'true' : 'false');
  bR.textContent = anim.st.explodeTarget ? 'Собрать' : 'Разобрать';
});
const bO = document.getElementById('bOchki');
bO.addEventListener('click', () => { anim.st.glassesTarget = anim.st.glassesTarget ? 0 : 1; bO.setAttribute('aria-pressed', anim.st.glassesTarget ? 'true' : 'false'); });
document.getElementById('bVid').addEventListener('click', () => { vidI = (vidI + 1) % VIDY.length; yaw = VIDY[vidI][0]; pitch = VIDY[vidI][1]; dYaw = 0; tihoDo = performance.now() + 6000; });
const bK = document.getElementById('bKrutit');
bK.addEventListener('click', () => { krutit = !krutit; bK.setAttribute('aria-pressed', krutit ? 'true' : 'false'); });

/* ---------- сохранение: снимок и модель ---------- */
let downloads = null;
if (window.claude && typeof window.claude.use === 'function'){
  window.claude.use('downloads').then(d => { downloads = d; }).catch(() => {});
}
async function otdat(filename, blob){
  if (downloads){
    try{ await downloads.save({ filename, data: blob }); toast('Сохранено: ' + filename); }
    catch(e){ if (e && e.code !== 'declined') toast('Не сохранилось: ' + (e.message || e.code)); }
    return;
  }
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob); a.download = filename;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 4000);
  toast('Скачивается: ' + filename);
}
document.getElementById('bSnimok').addEventListener('click', () => {
  r.render(scene, cam);
  cv.toBlob(b => { if (b) otdat('pixel-mech.png', b); }, 'image/png');
});
const bS = document.getElementById('bSkachat');
bS.addEventListener('click', async () => {
  if (!T.GLTFExporter){ toast('Экспортёр не загрузился — проверь интернет'); return; }
  bS.disabled = true; bS.textContent = 'Собираю…';
  try{
    const glb = await new Promise((res, rej) => {
      try{ new T.GLTFExporter().parse(PixelMech.exportScene(T, model), res, { binary: true }); }catch(e){ rej(e); }
    });
    await otdat('pixel-mech.glb', new Blob([glb], { type: 'model/gltf-binary' }));
  }catch(e){ toast('Не собралось: ' + (e.message || e)); }
  bS.disabled = false; bS.textContent = 'Скачать GLB';
});

/* ---------- цикл ---------- */
const v3 = new T.Vector3();
/* кадр учитывает шапку сверху и кнопки снизу: модель центрируется в свободной области */
let polyaV = 0, polyaN = 0;
function razmer(){
  const w = window.innerWidth, h = window.innerHeight;
  r.setSize(w, h, false); cam.aspect = w / h;
  polyaV = document.querySelector('header').getBoundingClientRect().bottom + 8;
  polyaN = h - document.querySelector('nav').getBoundingClientRect().top + 8;
  cam.setViewOffset(w, h, 0, (polyaN - polyaV) / 2, w, h);
  cam.updateProjectionMatrix();
}
window.addEventListener('resize', razmer); razmer();
function naEkran(g, local){
  v3.set(local[0], local[1], local[2]); g.localToWorld(v3); v3.project(cam);
  return [(v3.x + 1) / 2 * window.innerWidth, (1 - v3.y) / 2 * window.innerHeight, v3.z < 1];
}
function cikl(t){
  dtK = tPred ? Math.min(4, (t - tPred) / 16.67) : 1; tPred = t;
  if (krutit && t > tihoDo && !ptr.size) yaw += 0.0032 * dtK;
  else if (!ptr.size){ yaw += dYaw * dtK; dYaw *= Math.pow(0.92, dtK); }
  anim.update(t, dtK);
  model.root.position.y = Math.sin(t / 1400) * 0.05;
  const e = anim.st.explode;
  const vys = 30 * (1 + e * 0.6), shir = 27 * (1 + e * 0.3);
  const tan = Math.tan(T.MathUtils.degToRad(cam.fov / 2)), H = window.innerHeight;
  const dolya = Math.max(0.4, (H - polyaV - polyaN) / H);
  const nuzhno = Math.max(vys / (2 * tan * dolya), shir / (2 * tan * cam.aspect)) * dist;
  const cel = 13.9 + e * 8.2;
  cam.position.set(Math.sin(yaw) * Math.cos(pitch) * nuzhno, cel + Math.sin(pitch) * nuzhno, Math.cos(yaw) * Math.cos(pitch) * nuzhno);
  cam.lookAt(0, cel, 0);
  scene.updateMatrixWorld();
  r.render(scene, cam);
  const vid = e > 0.6 ? 1 : 0, W = window.innerWidth;
  const tochki = {};
  let kol = 0;
  Object.keys(metki).forEach(k => { const p = naEkran(P[k].g, PODPISI[k][1]); tochki[k] = p; kol = Math.max(kol, p[0]); });
  kol = Math.min(kol + 28, W - (W < 520 ? 118 : 170));
  Object.keys(metki).forEach(k => {
    const [x, y, ok] = tochki[k], el = metki[k], [ln, dot] = linii[k], o = ok ? vid : 0;
    el.style.opacity = o;
    el.style.transform = 'translate(' + kol.toFixed(1) + 'px,' + (y - 11).toFixed(1) + 'px)';
    ln.setAttribute('x1', x); ln.setAttribute('y1', y); ln.setAttribute('x2', kol); ln.setAttribute('y2', y);
    dot.setAttribute('cx', x); dot.setAttribute('cy', y);
    ln.style.opacity = dot.style.opacity = o;
  });
  MAGNITY.forEach(([k, loc], i) => {
    const [x, y, ok] = naEkran(P[k].g, loc);
    const el = magnity[i]; el.style.opacity = ok ? vid * 0.8 : 0;
    el.style.transform = 'translate(' + x.toFixed(1) + 'px,' + y.toFixed(1) + 'px)';
  });
  requestAnimationFrame(cikl);
}
requestAnimationFrame(cikl);
</script>
</body>
</html>
