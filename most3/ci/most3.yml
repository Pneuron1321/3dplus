# Мост 3 (com.questclaude.most3) — показ и звук карты захвата без HDMI Link. Отдельное приложение рядом с мостом 2,
# своя сборка: срабатывает только на most3/**. Ключ подписи — тот же, что у моста 2 (quest-bridge/app/debug.keystore.enc,
# пароль — секрет PODPIS): обновления встают поверх. APK — в выпусках most3-<версия>, файл most3-<версия>.apk;
# хранятся два последних выпуска most3-*.
name: most3
on:
  push:
    paths: ['most3/**', '.github/workflows/most3.yml']
  workflow_dispatch:
jobs:
  apk:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    defaults:
      run:
        working-directory: most3
    steps:
      - uses: actions/checkout@v4
      - name: Ключ подписи (тот же, что у моста 2)
        env:
          PODPIS: ${{ secrets.PODPIS }}
        run: |
          if [ -z "$PODPIS" ]; then echo "::error title=Нет секрета PODPIS::Без него APK не встанет поверх."; exit 1; fi
          P=$(printf '%s' "$PODPIS" | tr -d '[:space:]')
          P="$P" openssl enc -d -aes-256-cbc -pbkdf2 -iter 600000 -pass env:P \
            -in ../quest-bridge/app/debug.keystore.enc -out app/debug.keystore ||
            { echo "::error title=Неверный пароль::Секрет PODPIS не подходит."; exit 1; }
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Версия в коде = версия сборки
        run: |
          V=$(sed -n 's/.*versionName = "\([^"]*\)".*/\1/p' app/build.gradle.kts)
          grep -q "const val VERSIYA = \"$V\"" app/src/main/kotlin/com/questclaude/most3/Most.kt ||
            { echo "::error::Most.VERSIYA не совпадает с versionName $V"; exit 1; }
      - name: Тесты (UVC, шейдер, звук, пульт)
        run: chmod +x gradlew && ./gradlew --no-daemon :app:testDebugUnitTest
      - name: Сборка APK
        run: ./gradlew --no-daemon :app:assembleDebug
      - name: Проверка APK
        run: |
          APK=app/build/outputs/apk/debug/app-debug.apk
          BT=$(ls -d "$ANDROID_HOME"/build-tools/*/ | sort -V | tail -1)
          ls -la "$APK"
          "${BT}aapt2" dump badging "$APK" | grep -E "^package|sdkVersion|targetSdkVersion|uses-permission|launchable"
          "${BT}apksigner" verify --print-certs "$APK" | grep -E "SHA-256 digest" | head -1
          unzip -l "$APK" | grep -E "lib/arm64-v8a/libjnidispatch"
          rm -f app/debug.keystore
      - name: APK в выпуск
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          V=$(sed -n 's/.*versionName = "\([^"]*\)".*/\1/p' app/build.gradle.kts)
          F="most3-$V.apk"
          cp app/build/outputs/apk/debug/app-debug.apk "$F"
          gh release view "most3-$V" > /dev/null 2>&1 ||
            gh release create "most3-$V" --target "$GITHUB_SHA" --prerelease \
              --title "Мост 3 — $V" --notes "Мост 3: игра с карты захвата в шлеме без HDMI Link, версия $V."
          gh release upload "most3-$V" "$F" --clobber
          echo "::notice::APK: https://github.com/$GITHUB_REPOSITORY/releases/download/most3-$V/$F"
      - name: Хранить два последних выпуска most3-*
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release list --limit 100 --json tagName,createdAt \
            --jq '[.[] | select(.tagName | startswith("most3-"))] | sort_by(.createdAt) | reverse | .[2:] | .[].tagName' |
            while read -r t; do gh release delete "$t" --yes --cleanup-tag && echo "выпуск $t удалён"; done
