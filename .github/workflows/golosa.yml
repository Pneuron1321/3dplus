# Образцы голосов для Плюса (edge-tts) — синтез здесь, у GitHub (из рабочей среды сервис голосов закрыт).
# Запускается правкой tools/golosa/**; mp3 кладёт в docs/golosa и коммитит назад. Приложение не трогает.
name: golosa
on:
  push:
    paths: ['tools/golosa/**', '.github/workflows/golosa.yml']
  workflow_dispatch:
jobs:
  golosa:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install edge-tts
      - run: python3 tools/golosa/sdelat.py docs/golosa/nizhe
      - name: Положить mp3 в репозиторий
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/golosa
          git commit -m "Образцы голосов для Плюса [skip ci]" || exit 0
          git pull --rebase origin "$GITHUB_REF_NAME"
          git push origin "HEAD:$GITHUB_REF_NAME"
